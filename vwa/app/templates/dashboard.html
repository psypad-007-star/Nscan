
{% extends "base.html" %}

{% block title %}Dashboard{% endblock %}

{% block content %}

<div class="dashboard">

    <h1>Welcome, {{ user.username }}!</h1>

    <p>You are logged in.</p>

    <div class="panel">
        <h2>Your account</h2>

        <p><strong>Username:</strong> {{ user.username }}</p>
        <p><strong>Email:</strong> {{ user.email }}</p>
        <p><strong>Role:</strong> {{ user.role }}</p>
    </div>

</div>

{% endblock %}
